name: Test documentation bot
on:
  push:
    paths: ['.github/scripts/**', '.github/workflows/**', 'workflow-templates/**']
  pull_request:
    paths: ['.github/scripts/**', '.github/workflows/**', 'workflow-templates/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
